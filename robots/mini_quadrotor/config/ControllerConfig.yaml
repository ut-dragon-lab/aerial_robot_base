/**/aerial_robot_core:
  ros__parameters:
    aerial_robot_control_name: aerial_robot_control/under_actuated_pid_controller

    controller:
      uav_model: 0
      
      param_verbose: false

      hovering_approximate: false
      torque_allocation_matrix_inv_pub_interval: 0.05

      # NOTE: Always define parameters as double (5.0) instead of int (5)
      xy:
        p_gain: 1.0
        i_gain: 0.0
        d_gain: 1.5
        limit_sum: 1.5
        limit_p: 1.5
        limit_i: 0.0
        limit_d: 1.5

      roll_pitch:
        p_gain: 8.0
        i_gain: 0.0
        d_gain: 3.0
        limit_sum: 4.0
        limit_p: 3.0
        limit_i: 0.0
        limit_d: 2.0
        limit_err_p: 0.6
        start_integration_height: 0.3

      z:
        p_gain: 5.0
        i_gain: 2.5
        d_gain: 5.0
        limit_err_p: 1.0
        limit_sum: 10.0 # N for clamping thrust force
        limit_p: 20.0 # M / s^2
        limit_i: 40.0 # M / s^2
        limit_d: 20.0 # M / s^2
        landing_err_z: -0.2
        force_landing_descending_rate: -0.6

      yaw:
        p_gain: 4.0
        i_gain: 0.0
        d_gain: 2.0
        limit_sum: 6.0  # N for clamping thrust force
        limit_p: 4.0
        limit_i: 4.0
        limit_d: 4.0
        limit_err_p: 0.4
        need_d_control: false

      # LQI gain generator
      lqi:
        gain_generate_rate: 15.0
        realtime_update: false
        gyro_moment_compensation: true
        clamp_gain: true
        lqi_mode: 4

        roll_pitch_p: 15.0 # 20.0
        roll_pitch_i: 0.5
        roll_pitch_d: 0.5 # 1.0 #0.15

        yaw_p: 60.0
        yaw_i: 0.5
        yaw_d: 1.0

        r1: 1.0
        r2: 1.0
        r3: 1.0
        r4: 1.0

        trans_constraint_weight: 100.0
        att_control_weight: 1.0
