/**/aerial_robot_core:
  ros__parameters:
    estimation:
      fusion:
        egomotion_list:
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        experiment_list:
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        egomotion_id1: 1
        egomotion_id2: 2
        egomotion_id3: 4
        experiment_id1: 1
        experiment_id2: 2
        experiment_id3: 4
        egomotion_label1: /ee/x
        egomotion_label2: /ee/y
        egomotion_label3: /ee/z
        experiment_label1: /ex/x
        experiment_label2: /ex/y
        experiment_label3: /ex/z
        sensor_list:
        - sensor_plugin/imu
        - sensor_plugin/mocap
        - sensor_plugin/ground_truth
        sensor_plugin:
          imu:
            estimate_mode: 3
            use_msg_stamp: false
            level_acc_noise_sigma: 0.05
            z_acc_noise_sigma: 0.05
            level_acc_bias_noise_sigma: 0.001
            z_acc_bias_noise_sigma: 0.001
          mocap:
            estimate_mode: 6
            pos_noise_sigma: 0.0002
            acc_bias_noise_sigma: 0.001
            time_sync: false
